<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLASHBOX - Global Movie Aggregator</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #1a1c23;
            --accent-color: #e50914;
            --text-color: #ffffff;
            --text-muted: #a3a3a3;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(15, 16, 21, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e3d;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 1px;
            cursor: pointer;
            text-decoration: none;
        }

        .search-container {
            display: flex;
            gap: 0.5rem;
        }

        input[type="text"] {
            padding: 0.6rem 1rem;
            border-radius: 4px;
            border: 1px solid #2a2e3d;
            background: #14161b;
            color: var(--text-color);
            width: 220px;
            outline: none;
            transition: var(--transition);
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
            width: 260px;
        }

        button {
            padding: 0.6rem 1.2rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        button:hover {
            opacity: 0.9;
        }

        .filters {
            display: flex;
            gap: 0.5rem;
            padding: 1rem 2rem;
            overflow-x: auto;
            background: #14161b;
            border-bottom: 1px solid #2a2e3d;
        }

        .filter-btn {
            background: #222530;
            color: var(--text-muted);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-color);
            color: white;
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(229, 9, 20, 0.2);
        }

        .movie-poster {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background-color: #2a2e3d;
        }

        .movie-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .movie-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5krem;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .rating {
            color: #f5c518;
            font-weight: bold;
        }

        /* Detail View Modal/Section */
        .detail-view {
            display: none;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 0.4s ease;
        }

        .detail-view.active {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .detail-poster {
            width: 300px;
            border-radius: 8px;
            object-fit: cover;
        }

        .detail-content {
            flex: 1;
            min-width: 280px;
        }

        .detail-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .detail-overview {
            color: var(--text-muted);
            line-height: 1.6;
            margin: 1rem 0;
        }

        .download-btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.8rem 1.5rem;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: #14161b;
            color: var(--text-muted);
            border-top: 1px solid #2a2e3d;
            font-size: 0.9rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media(max-width: 768px) {
            header { padding: 1rem; flex-direction: column; gap: 1rem; }
            .search-container { width: 100%; justify-content: center; }
            input[type="text"] { width: 100%; }
            .detail-view.active { flex-direction: column; align-items: center; }
            .detail-poster { width: 100%; max-height: 400px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">KLASHBOX</a>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search movies or series...">
            <button id="searchBtn">Search</button>
        </div>
    </header>

    <div class="filters">
        <button class="filter-btn active" data-category="trending">Trending</button>
        <button class="filter-btn" data-category="popular">Popular Movies</button>
        <button class="filter-btn" data-category="tv">Popular TV Shows</button>
        <button class="filter-btn" data-category="top_rated">Top Rated</button>
    </div>

    <main>
        <!-- Single Movie/Series Detail Container -->
        <div id="detailView" class="detail-view">
            <img id="detailPoster" class="detail-poster" src="" alt="Poster">
            <div class="detail-content">
                <h1 id="detailTitle" class="detail-title"></h1>
                <p id="detailMeta" class="movie-meta"></p>
                <p id="detailOverview" class="detail-overview"></p>
                <button id="downloadBtn" class="download-btn" onclick="triggerAdAndDownload()">Stream / Download</button>
                <br><br>
                <button class="filter-btn" onclick="closeDetails()">← Back to Library</button>
            </div>
        </div>

        <!-- Main Grid Container -->
        <div id="movieGrid" class="movie-grid">
            <!-- Dynamic Cards Loaded Here -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 KLASHBOX. All rights reserved.</p>
        <p style="margin-top: 0.3rem; color: #e50914; font-weight: 600;">Developed by Rufai Ikhlas Ajibola (KLASH WORLD)</p>
    </footer>

    <!-- Adsterra Popunder Script Integration -->
    <script data-cfasync="false" src="https://abscloud.org/1/97aac82cdeb5c060c376ed1776feebc1"></script>

    <script>
        const TMDB_API_KEY = 'D6d50080fc685da8615297deabffd133';
        const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';
        
        let currentCategory = 'trending';
        let selectedMovieId = null;

        const gridEl = document.getElementById('movieGrid');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const detailView = document.getElementById('detailView');
        const filterBtns = document.querySelectorAll('.filter-btn[data-category]');

        // Initialize App & Check Deep Link (?movie=ID)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const movieId = urlParams.get('movie');
            
            if (movieId) {
                fetchMovieDetails(movieId);
            } else {
                fetchMovies(currentCategory);
            }
        });

        // Category Filter Switcher
        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.getAttribute('data-category');
                closeDetails();
                fetchMovies(currentCategory);
            });
        });

        // Search Action
        searchBtn.addEventListener('click', () => {
            const query = searchInput.value.trim();
            if (query) searchMovies(query);
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (query) searchMovies(query);
            }
        });

        async function fetchMovies(category) {
            let endpoint = '';
            if (category === 'trending') endpoint = `https://api.themoviedb.org/3/trending/all/day?api_key=${TMDB_API_KEY}`;
            else if (category === 'popular') endpoint = `https://api.themoviedb.org/3/movie/popular?api_key=${TMDB_API_KEY}`;
            else if (category === 'tv') endpoint = `https://api.themoviedb.org/3/tv/popular?api_key=${TMDB_API_KEY}`;
            else if (category === 'top_rated') endpoint = `https://api.themoviedb.org/3/movie/top_rated?api_key=${TMDB_API_KEY}`;

            try {
                const res = await fetch(endpoint);
                const data = await res.json();
                displayMovies(data.results);
            } catch (err) {
                gridEl.innerHTML = '<p style="color:red; text-align:center; grid-column:1/-1;">Failed to load catalog data. Check API key status.</p>';
            }
        }

        async function searchMovies(query) {
            closeDetails();
            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                displayMovies(data.results);
            } catch (err) {
                console.error("Search error", err);
            }
        }

        function displayMovies(movies) {
            gridEl.innerHTML = '';
            if (!movies || movies.length === 0) {
                gridEl.innerHTML = '<p style="text-align:center; grid-column:1/-1;">No titles found.</p>';
                return;
            }

            movies.forEach(movie => {
                const title = movie.title || movie.name || 'Untitled';
                const releaseDate = movie.release_date || movie.first_air_date || 'N/A';
                const posterPath = movie.poster_path ? IMAGE_BASE_URL + movie.poster_path : 'https://via.placeholder.com/200x300?text=No+Image';
                const rating = movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A';

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => loadMovieDetails(movie.id);

                card.innerHTML = `
                    <img class="movie-poster" src="${posterPath}" alt="${title}" loading="lazy">
                    <div class="movie-info">
                        <div class="movie-title">${title}</div>
                        <div class="movie-meta">
                            <span>${releaseDate.substring(0, 4)}</span>
                            <span class="rating">★ ${rating}</span>
                        </div>
                    </div>
                `;
                gridEl.appendChild(card);
            });
        }

        async function loadMovieDetails(id) {
            // Update URL query parameter for direct linking support
            const newUrl = `${window.location.pathname}?movie=${id}`;
            window.history.pushState({path: newUrl}, '', newUrl);
            fetchMovieDetails(id);
        }

        async function fetchMovieDetails(id) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${TMDB_API_KEY}`);
                if (!res.ok) {
                    // Fallback to TV series lookup if movie ID fails
                    fetchTvDetails(id);
                    return;
                }
                const movie = await res.json();
                renderDetailView({
                    title: movie.title,
                    poster: movie.poster_path ? IMAGE_BASE_URL + movie.poster_path : '',
                    release: movie.release_date || 'N/A',
                    rating: movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A',
                    overview: movie.overview,
                    runtime: movie.runtime ? `${movie.runtime} mins` : ''
                });
            } catch (err) {
                console.error("Detail fetch error", err);
            }
        }

        async function fetchTvDetails(id) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/tv/${id}?api_key=${TMDB_API_KEY}`);
                const tv = await res.json();
                renderDetailView({
                    title: tv.name,
                    poster: tv.poster_path ? IMAGE_BASE_URL + tv.poster_path : '',
                    release: tv.first_air_date || 'N/A',
                    rating: tv.vote_average ? tv.vote_average.toFixed(1) : 'N/A',
                    overview: tv.overview,
                    runtime: tv.number_of_seasons ? `${tv.number_of_seasons} Seasons` : ''
                });
            } catch (err) {
                console.error("TV detail fetch error", err);
            }
        }

        function renderDetailView(data) {
            document.getElementById('detailPoster').src = data.poster;
            document.getElementById('detailTitle').textContent = data.title;
            document.getElementById('detailMeta').innerHTML = `<span>Release: ${data.release}</span> • <span class="rating">★ ${data.rating}</span> • <span>${data.runtime}</span>`;
            document.getElementById('detailOverview').textContent = data.overview;
            
            gridEl.style.display = 'none';
            document.querySelector('.filters').style.display = 'none';
            detailView.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeDetails() {
            window.history.pushState({}, '', window.location.pathname);
            detailView.classList.remove('active');
            gridEl.style.display = 'grid';
            document.querySelector('.filters').style.display = 'flex';
        }

        // Popunder monetization trigger handler when stream/download is clicked
        function triggerAdAndDownload() {
            // The Adsterra script automatically hooks into user interaction events to deploy the popunder tab seamlessly.
            alert("Preparing your secure link connection...");
            // You can replace or route to your preferred download endpoint below:
            // window.location.href = "YOUR_DIRECT_DOWNLOAD_OR_STREAM_LINK";
        }
    </script>
</body>
</html>
